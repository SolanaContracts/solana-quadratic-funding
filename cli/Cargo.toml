[package]
name = "qf-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qf-cli"
path = "src/main.rs"

[dependencies]
solana-quadratic-funding = { path = "../programs/solana-quadratic-funding", features = ["no-entrypoint"] }
